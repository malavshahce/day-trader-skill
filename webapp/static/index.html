<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Trader Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky desk header with market clock, scrolling tab strip, one working surface, detail drawer on top.
   Palette: graphite ink on cool paper, steel-teal accent, amber for caution, green/red only for gain/loss and PASS/BLOCK. */
:root {
  --bg: #edf0f3; --surface: #ffffff; --surface2: #f5f7f9; --ink: #111a22; --muted: #5a6773; --line: #d6dce3;
  --accent: #1b6a87; --accent-ink: #ffffff; --accent-soft: #dcebf1;
  --good: #17784f; --good-soft: #dff1e8; --bad: #b83a33; --bad-soft: #f8e1df; --warn: #8f5d0c; --warn-soft: #f7ebd2;
  --shadow: 0 1px 2px rgba(17,26,34,.06), 0 6px 20px rgba(17,26,34,.06);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1217; --surface: #151c23; --surface2: #1b242d; --ink: #e6ecf1; --muted: #93a1ae; --line: #2a3541;
    --accent: #6cbad6; --accent-ink: #0b1a22; --accent-soft: #19313c;
    --good: #46c28e; --good-soft: #14302a; --bad: #f0746c; --bad-soft: #3a1f1d; --warn: #e2ab4a; --warn-soft: #3a2e15;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1217; --surface: #151c23; --surface2: #1b242d; --ink: #e6ecf1; --muted: #93a1ae; --line: #2a3541;
  --accent: #6cbad6; --accent-ink: #0b1a22; --accent-soft: #19313c;
  --good: #46c28e; --good-soft: #14302a; --bad: #f0746c; --bad-soft: #3a1f1d; --warn: #e2ab4a; --warn-soft: #3a2e15;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--cond); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 20px; } h3 { font-size: 15px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin-inline: auto; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin-inline: -16px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--cond); font-size: 22px; font-weight: 600; letter-spacing: .02em; }
.brand small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.clock { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface2); border: 1px solid var(--line); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.pill.open { color: var(--good); } .pill.open i { background: var(--good); }
.pill.pre, .pill.after { color: var(--warn); } .pill.pre i, .pill.after i { background: var(--warn); }
.pill.good { color: var(--good); background: var(--good-soft); border-color: transparent; }
.pill.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.pill.acc { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

/* surfaces */
main { padding-block: 18px; display: grid; gap: 16px; }
.grid { display: grid; gap: 16px; align-items: start; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flat { background: var(--surface2); }
.card h3 + .muted { margin-top: 2px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.src { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.note { padding: 10px 12px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.note.info { background: var(--accent-soft); color: var(--accent); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.good { background: var(--good-soft); color: var(--good); }

/* tiles */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--surface2); min-width: 0; }
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile .v { font-family: var(--mono); font-size: 18px; font-weight: 500; margin-top: 2px; overflow-wrap: anywhere; }
.tile .d { font-family: var(--mono); font-size: 12px; }
.up { color: var(--good); } .down { color: var(--bad); }

/* tables */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface2); font-weight: 500; }
th button { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; }
th button[aria-sort] { color: var(--ink); }
td.r, th.r { text-align: right; }
tr.clk { cursor: pointer; }
tr.clk:hover td { background: var(--surface2); }
.sym { font-family: var(--mono); font-weight: 500; }
.sym + .pill { margin-left: 8px; }
.nm { color: var(--muted); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: block; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.s { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* forms */
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f.wide { grid-column: 1 / -1; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; color: var(--ink); }
input[type="checkbox"] { width: auto; }
input.num, textarea.mono { font-family: var(--mono); }
input:invalid, input.bad { border-color: var(--bad); }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.p { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.err { color: var(--bad); font-size: 12px; min-height: 16px; }

/* results */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.big { font-family: var(--mono); font-size: 28px; font-weight: 500; line-height: 1.1; }
.verdict { display: inline-block; font-family: var(--cond); font-size: 20px; padding: 3px 14px; border-radius: 6px; font-weight: 600; letter-spacing: .06em; }
.verdict.PASS { background: var(--good-soft); color: var(--good); } .verdict.BLOCK { background: var(--bad-soft); color: var(--bad); }
.checks { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; }
.checks .ok { color: var(--good); } .checks .no { color: var(--bad); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 3px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.limit.binds .bar > span { background: var(--warn); }
.limit { padding: 6px 0; border-bottom: 1px dashed var(--line); } .limit:last-child { border: 0; }
.ticket { font-family: var(--mono); font-size: 13px; background: var(--surface2); border: 1px dashed var(--line); border-radius: 6px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* news */
.item { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.item:last-child { border: 0; }
.item a { color: var(--ink); text-decoration: none; font-weight: 500; }
.item a:hover { text-decoration: underline; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(8,12,16,.5); z-index: 40; }
.drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow); overflow-y: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); padding-top: calc(18px + env(safe-area-inset-top, 0px)); display: grid; gap: 14px; align-content: start; }

/* chat */
.chat { display: grid; gap: 10px; }
.bub { padding: 10px 12px; border-radius: 8px; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
.bub.u { background: var(--accent-soft); justify-self: end; max-width: 92%; }
.bub.a { background: var(--surface); border: 1px solid var(--line); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
.hint { font-size: 11px; color: var(--muted); }
details.how { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--surface2); margin-bottom: 12px; }
details.how summary { cursor: pointer; font-weight: 600; }
details.how ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.step { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; grid-column: 1 / -1; margin-top: 4px; }
.words { font-size: 15px; line-height: 1.6; padding: 12px 14px; background: var(--accent-soft); border-radius: 6px; margin-bottom: 12px; }
.next { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.doc h3 { margin-top: 18px; } .doc p, .doc li { max-width: 72ch; } .doc ul, .doc ol { padding-left: 20px; display: grid; gap: 4px; margin: 8px 0; }
.doc dt { font-weight: 600; margin-top: 8px; } .doc dd { margin: 0; color: var(--muted); max-width: 72ch; }
.foot { font-size: 12px; color: var(--muted); margin-top: 8px; }
@media (max-width: 560px) { .hide-s { display: none; } .big { font-size: 24px; } }
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .chip { transition: border-color .12s, background-color .12s, color .12s; } }
.clock { flex-wrap: wrap; justify-content: flex-end; }
#clock { white-space: nowrap; }
td.wrapc, td.wrapc .pill { white-space: normal; }
@media (max-width: 560px) { [data-lv] .small { display: block; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">Trader Desk<small id="asof">loading…</small></div>
      <div class="clock"><span id="lvpill" class="pill"><i></i><span>Prices…</span></span><button class="btn sm" data-act="refresh" aria-label="Refresh prices">↻</button><span id="clock" class="muted"></span><span id="mkt" class="pill"><i></i><span>–</span></span></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  </header>
  <main id="view" aria-live="polite"></main>
  <p class="foot">Educational tool, not financial advice. Prices come from Yahoo through this server and can be delayed up to 15 minutes. Nothing here places an order. Confirm every price in your broker.</p>
</div>
<div id="layer"></div>

<script src="/lib.js"></script>
<script>
(function () {
  "use strict";
  var L = window.TraderLib;
  var TABS = [["today", "Today"], ["scanner", "Scanner"], ["movers", "Movers"], ["planner", "Planner"], ["options", "Options"], ["news", "News"], ["journal", "Journal"], ["guide", "Guide"], ["settings", "Settings"]];
  var CFG_FIELDS = [
    ["budget", "Account budget ($)", "number"], ["max_loss_per_trade_usd", "Max loss per trade ($)", "number"],
    ["max_daily_loss_usd", "Daily loss limit ($)", "number"], ["max_trades_per_day", "Trades per day", "number"],
    ["max_position_pct", "Max position (% of budget)", "number"], ["max_order_usd", "Max order ($)", "number"],
    ["cash_buffer_pct", "Cash buffer (%)", "number"], ["min_reward_risk", "Min reward:risk", "number"],
    ["no_entries_before", "No entries before (ET)", "time"], ["no_entries_after", "No entries after (ET)", "time"], ["flat_by", "Flat by (ET)", "time"]
  ];
  var S = {
    tab: "today", cfg: Object.assign({}, L.DEFAULTS), scan: null, news: null, earn: null, market: null, loadErr: null,
    f: { query: "", setup: "all", fit: false, maxPrice: "", sort: "dollar", dir: "desc", shown: 50 },
    news_f: { ticker: "all", tag: "all", shown: 40 },
    plan: { symbol: "TSLA", entry: "364.18", stopRule: "or_mid", orHigh: "362.18", orLow: "354.47", stopParam: "", atr: "", targetRule: "r", targetParam: "1", example: true },
    csp: { symbol: "KEY", price: "21.21", strike: "19.5", premium: "0.35", expiry: "", account: "", riskPct: "1", example: true },
    journal: [], store: "local", dbNote: "", settingsErr: "",
    drawer: null, q: {}, qAt: 0, qErr: "", chain: null, chainErr: "", chainBusy: false, scanSt: null
  };
  var IS_WEB = true;
  var db = null, writeQ = Promise.resolve();

  /* ---------------- helpers ---------------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u)) ? String(u) : "#"; }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
  function fmtVol(n) { return n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(0) + "K" : String(n); }
  function fmtPct(p, d) { return (p > 0 ? "+" : "") + p.toFixed(d === undefined ? 2 : d) + "%"; }
  function cls(p) { return p > 0 ? "up" : p < 0 ? "down" : ""; }
  function fmtET(iso) {
    var d = new Date(iso); if (isNaN(d)) return "";
    return new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }).format(d) + " ET";
  }
  function fmtDay(ymd) {
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || ""); if (!p) return ymd || "";
    return new Intl.DateTimeFormat("en-US", { timeZone: "UTC", month: "short", day: "numeric" }).format(new Date(Date.UTC(+p[1], +p[2] - 1, +p[3])));
  }
  function dayDiff(a, b) { // whole days from a to b (YYYY-MM-DD)
    function u(s) { var p = s.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
    return Math.round((u(b) - u(a)) / 86400000);
  }
  function today() { return L.nyParts(new Date()).date; }
  function addDays(ymd, n) {   // calendar days, so a clock change never moves the date
    var p = ymd.split("-"); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10);
  }
  function setupName(k) { return L.SETUPS[k] || k; }
  function N(id) { var e = document.getElementById(id); return e ? e.value : ""; }
  function fitMax() { var c = S.cfg; return Math.min(L.num(c.budget) * L.num(c.max_position_pct) / 100, L.num(c.max_order_usd) || Infinity); }
  function scanMap() {
    if (!S.scan) return {};
    if (!S.scan._map) { var m = {}; S.scan.hits.forEach(function (r) { m[r[0]] = r; }); S.scan._map = m; }
    return S.scan._map;
  }
  function earnInfo(sym) {
    var e = S.earn && S.earn.earnings[sym]; if (!e || !e.earn) return null;
    var d = dayDiff(today(), e.earn);
    return { date: e.earn, days: d, soon: d >= 0 && d <= 7, justReported: d < 0 && d >= -3 };
  }
  function earnTag(sym) {
    var i = earnInfo(sym); if (!i) return "";
    if (i.soon) return '<span class="pill warn" title="Earnings inside a week">Reports ' + esc(fmtDay(i.date)) + (i.days === 0 ? " (today)" : " (" + i.days + "d)") + "</span>";
    if (i.justReported) return '<span class="pill">Reported ' + esc(fmtDay(i.date)) + "</span>";
    return "";
  }

  /* ---------------- storage: shared db when the viewer has it, else this device ---------------- */
  function cfgClean(o) {
    var out = {}; CFG_FIELDS.forEach(function (f) {
      var v = o && o[f[0]];
      if (f[2] === "time") out[f[0]] = isFinite(L.hhmmToMin(v)) ? String(v) : L.DEFAULTS[f[0]];
      else out[f[0]] = isFinite(L.num(v)) && L.num(v) >= 0 ? L.num(v) : L.DEFAULTS[f[0]];
    }); return out;
  }
  function loadLocal() {
    try { var c = JSON.parse(lsGet("td.cfg") || "null"); if (c) S.cfg = cfgClean(c); } catch (e) { /* ignore */ }
    try { var j = JSON.parse(lsGet("td.journal") || "[]"); if (Array.isArray(j)) S.journal = j; } catch (e) { /* ignore */ }
  }
  function queue(fn) { writeQ = writeQ.then(fn).catch(function (e) { S.dbNote = "Could not save: " + (e && e.message ? e.message : "unknown error"); renderIfTab(["settings", "journal"]); }); return writeQ; }
  function saveCfg() { lsSet("td.cfg", JSON.stringify(S.cfg)); }
  function jAdd(e) {
    e.created = new Date().toISOString();
    e.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    S.journal.unshift(e); lsSet("td.journal", JSON.stringify(S.journal)); return Promise.resolve();
  }
  function jUpdate(id, patch) {
    S.journal = S.journal.map(function (x) { return x.id === id ? Object.assign({}, x, patch) : x; });
    lsSet("td.journal", JSON.stringify(S.journal)); return Promise.resolve();
  }
  function jDelete(id) {
    S.journal = S.journal.filter(function (x) { return x.id !== id; });
    lsSet("td.journal", JSON.stringify(S.journal)); return Promise.resolve();
  }
  function todayStats() {
    var t = today(), risked = 0, n = 0;
    S.journal.forEach(function (j) { if (j.day === t) { n++; risked += Math.max(0, (L.num(j.entry) - L.num(j.stop)) * L.num(j.qty)) || 0; } });
    return { trades: n, risked: Math.round(risked * 100) / 100 };
  }

  /* ---------------- shell ---------------- */
  function renderTabs() {
    $("#tabs").innerHTML = TABS.map(function (t) {
      return '<button class="tab" role="tab" data-act="tab" data-v="' + t[0] + '" aria-selected="' + (S.tab === t[0]) + '">' + esc(t[1]) + "</button>";
    }).join("");
  }
  function renderClock() {
    var m = L.marketStatus(new Date());
    $("#clock").textContent = m.weekday + " " + m.time + " ET";
    var el = $("#mkt"), label = { open: "Market open", pre: "Pre-market", after: "After hours", closed: m.tradingDay ? "Closed" : "Closed today" }[m.state];

    var el = $("#mv-body"); if (!el) return;
    Array.prototype.forEach.call(document.querySelectorAll("#mv-chips .chip"), function (c) { c.setAttribute("aria-pressed", String(c.getAttribute("data-v") === MV.filter)); });
    var src = $("#mv-src");
    if (!MV.data) { el.innerHTML = MV.err ? '<div class="note bad">' + esc(MV.err) + "</div>" : '<p class="muted">Loading movers…</p>'; return; }
    if (src) src.textContent = "Updated " + ago(MV.data.as_of) + " · " + (MV.data.checked || 0).toLocaleString() + " stocks";
    if (MV.data.building) { el.innerHTML = '<div class="note info">Building the list of liquid stocks. This happens once a day and takes under a minute.</div>'; return; }
    var rows = moverRows();
    el.innerHTML = rows.length ? '<div class="scroll"><table><thead><tr><th>Stock</th><th class="r hide-s">Close</th><th class="r">Now</th><th class="r">Move</th><th class="r hide-s">Volume</th></tr></thead><tbody>' + rows.map(moverTr).join("") + '</tbody></table></div><p class="foot">Tap a row for details and to plan a trade. Pre-market and after-hours prices trade thinly and can jump. Data is delayed.</p>' : '<p class="empty">No stocks match this filter right now.</p>';
  }
  function paintMoversCards() {
    var el = $("#td-movers"); if (!el) return;
    if (!MV.data) { el.innerHTML = '<div class="head"><h2>After-hours and pre-market movers</h2></div><p class="muted">' + esc(MV.err || "Loading…") + "</p>"; loadMovers(false); return; }
    var rows = (MV.data.rows || []).slice().sort(function (a, b) { return (earnTagFor(b) ? 1 : 0) - (earnTagFor(a) ? 1 : 0) || Math.abs(b.move) - Math.abs(a.move); }).slice(0, 6);
    el.innerHTML = '<div class="head"><h2>Earnings reactions and big moves</h2><span class="src">Updated ' + esc(ago(MV.data.as_of)) + '</span></div>' + (MV.data.building ? '<p class="muted">Building the list of liquid stocks…</p>' : rows.length ? '<div class="scroll"><table><thead><tr><th>Stock</th><th class="r hide-s">Close</th><th class="r">Now</th><th class="r">Move</th><th class="r hide-s">Volume</th></tr></thead><tbody>' + rows.map(moverTr).join("") + '</tbody></table></div><p class="foot">These moved after the regular session or early today, so the daily scan cannot see them. <a href="#movers" data-act="tab" data-v="movers">See all movers</a></p>' : '<p class="muted">Nothing is moving more than 2% right now.</p>');
  }

  /* ---------------- look up any stock ---------------- */
  async function lookupStock() {
    var el = $("#lk-out"), sym = N("lk-sym").trim().toUpperCase().replace(/[^A-Z0-9.\-^]/g, "");
    if (!el) return;
    if (!validSym(sym)) { el.innerHTML = '<p class="err">Type a stock symbol, for example AMZN.</p>'; return; }
    el.innerHTML = '<p class="muted">Checking ' + esc(sym) + "…</p>";
    try {
      var r = await fetch("/api/lookup?symbol=" + encodeURIComponent(sym), { cache: "no-store" });
      if (r.status === 404) { el.innerHTML = '<div class="note">No chart data found for ' + esc(sym) + ". Check the symbol.</div>"; return; }
      if (!r.ok) throw new Error("http " + r.status);
      var d = await r.json(), n = d.setups.length;
      var h = '<div class="card flat" style="margin-top:12px"><div class="head"><div><h3 class="mono" style="display:inline">' + esc(d.symbol) + '</h3> <span class="muted">' + esc(d.name) + '</span></div><span class="pill ' + (n ? "good" : "") + '">' + (n ? "Matches " + n + " setup" + (n === 1 ? "" : "s") : "No setup today") + "</span></div>";
      h += "<p>Close <b>" + d.close.toFixed(2) + "</b> (" + esc(fmtDay(d.as_of)) + ") · RSI " + d.rsi.toFixed(0) + ' · Live <span data-lv="' + esc(d.symbol) + '"></span>' + (d.earn ? " · Earnings " + esc(fmtDay(d.earn)) : "") + "</p>";
      h += '<ul class="checks">' + d.checks.map(function (c) { return '<li><span class="' + (c.match ? "ok" : "no") + '">' + (c.match ? "✓" : "✕") + "</span><span><b>" + esc(setupName(c.k)) + ".</b> " + esc(c.why) + "</span></li>"; }).join("") + "</ul>";
      h += '<div class="row" style="margin-top:10px"><button class="btn p sm" data-act="plan" data-v="' + esc(d.symbol) + '">Plan this trade</button><button class="btn sm" data-act="open" data-v="' + esc(d.symbol) + '">Details</button></div>';
      h += '<p class="foot">The scan only reads regular-session closes. A move after the close, such as an earnings reaction, shows in the <a href="#movers" data-act="tab" data-v="movers">Movers</a> tab instead.</p></div>';
      el.innerHTML = h; ensureQuotes(false);
    } catch (e) { el.innerHTML = '<div class="note bad">Could not check ' + esc(sym) + " right now. Try again in a moment.</div>"; }
  }
  document.addEventListener("keydown", function (ev) { if (ev.key === "Enter" && ev.target && ev.target.id === "lk-sym") lookupStock(); });

  /* ---------------- news: newest first, refresh on demand ---------------- */
  function paintNewsAge() {
    var el = $("#n-age"); if (!el || !S.news) return;
    el.textContent = "Updated " + (S.news.checked ? ago(S.news.checked) : "just now") + (S.news.refreshing ? " · refreshing…" : "");
  }
  async function reloadNews() {
    try {
      var r = await fetch("/api/news", { cache: "no-store" }); if (!r.ok) return null;
      var d = await r.json(); if (!d || !d.items) return null;
      var changed = !S.news || d.checked !== S.news.checked;
      S.news = d;
      if (S.tab === "news" && changed && !isEditing()) updateNews();
      paintNewsAge(); return d;
    } catch (e) { return null; }
  }
  async function refreshNews() {
    var b = $("#n-refresh"); if (b) b.disabled = true;
    var before = S.news && S.news.checked;
    try { await fetch("/api/news?refresh=1", { cache: "no-store" }); } catch (e) { /* the polling below shows the old news */ }
    for (var i = 0; i < 12; i++) {
      await new Promise(function (res) { setTimeout(res, 4000); });
      var d = await reloadNews();
      if (d && d.checked !== before && !d.refreshing) break;
    }
    var b2 = $("#n-refresh"); if (b2) b2.disabled = false;
    paintNewsAge();
  }

  /* ---------------- scan status ---------------- */
  async function loadStatus() {
    try { var r = await fetch("/api/status", { cache: "no-store" }); if (r.ok) S.scanSt = (await r.json()).scan; } catch (e) { /* keep the last status */ }
    paintScan();
  }
  function paintScan() {
    var el = $("#scan-st"), s = S.scanSt, b = $("[data-act=runscan]");
    if (el) el.textContent = !s ? "" : s.running ? "Scanning: " + (s.step || "working") + ". This takes a few minutes." : s.error ? "Last run failed: " + s.error : s.finished ? "Last run finished " + fmtET(s.finished) : "";
    if (b) b.disabled = !!(s && s.running);
  }
  async function runScan() {
    try { var r = await fetch("/api/scan/run", { method: "POST" }); if (!r.ok && r.status !== 409) throw new Error("http " + r.status); }
    catch (e) { S.scanSt = { running: false, error: "could not start the scan" }; paintScan(); return; }
    S.scanSt = { running: true, step: "starting" }; paintScan(); pollScan();
  }
  function pollScan() {
    clearTimeout(scanPoll);
    scanPoll = setTimeout(async function () {
      var before = S.scanSt && S.scanSt.finished;
      await loadStatus();
      if (S.scanSt && S.scanSt.running) pollScan(); else if (S.scanSt && !S.scanSt.error) reloadScan();
    }, 5000);
  }
  async function reloadScan() {
    try {
      var r = await fetch("/api/scan", { cache: "no-store" }); if (!r.ok) return;
      var d = await r.json();
      if (d.hits && d.hits.length && (!S.scan || d.as_of !== S.scan.as_of)) { S.scan = d; S.scan._map = null; $("#asof").textContent = "scan " + d.as_of; if (!isEditing()) render(); }
    } catch (e) { /* keep the current scan */ }
  }
  function startLive() {
    loadStatus().then(function () { if (S.scanSt && S.scanSt.running) pollScan(); });
    ensureQuotes(true);
    setInterval(function () { if (!document.hidden) ensureQuotes(false); }, 15000);
    setInterval(function () { if (!document.hidden) { refreshMarket(); reloadScan(); } }, 60000);
    setInterval(function () { if (!document.hidden) { if (S.tab === "movers" || S.tab === "today") loadMovers(false); if (S.tab === "news") reloadNews(); } }, 60000);
    loadMovers(false);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) ensureQuotes(false); });
  }

  /* ---------------- boot ---------------- */
  function fetchJSON(p) { return fetch(p, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }); }
  async function boot() {
    S.loadErr = null;
    var res = await Promise.allSettled([fetchJSON("/api/scan"), fetchJSON("/api/news"), fetchJSON("/api/earnings"), fetchJSON("/api/market")]);
    var bad = res.filter(function (r) { return r.status === "rejected"; });
    if (bad.length) S.loadErr = "Could not load the data (" + bad.map(function (b) { return b.reason && b.reason.message; }).join(", ") + "). Check your connection and try again.";
    else { S.scan = res[0].value; S.news = res[1].value; S.earn = res[2].value; S.market = res[3].value; }
    if (S.scan) $("#asof").textContent = "scan " + S.scan.as_of;
    else $("#asof").textContent = "no data";
    var hash = (location.hash || "").replace("#", ""), saved = lsGet("td.tab");
    var want = TABS.some(function (t) { return t[0] === hash; }) ? hash : TABS.some(function (t) { return t[0] === saved; }) ? saved : "today";
    S.tab = want;
    render();
    startLive();
  }
  loadLocal();
  renderTabs(); renderClock();
  setInterval(renderClock, 20000);
  boot();
})();
</script>

</body></html>
