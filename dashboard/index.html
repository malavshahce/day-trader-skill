<title>Trader Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky desk header with market clock, scrolling tab strip, one working surface, detail drawer on top.
   Palette: graphite ink on cool paper, steel-teal accent, amber for caution, green/red only for gain/loss and PASS/BLOCK. */
:root {
  --bg: #edf0f3; --surface: #ffffff; --surface2: #f5f7f9; --ink: #111a22; --muted: #5a6773; --line: #d6dce3;
  --accent: #1b6a87; --accent-ink: #ffffff; --accent-soft: #dcebf1;
  --good: #17784f; --good-soft: #dff1e8; --bad: #b83a33; --bad-soft: #f8e1df; --warn: #8f5d0c; --warn-soft: #f7ebd2;
  --shadow: 0 1px 2px rgba(17,26,34,.06), 0 6px 20px rgba(17,26,34,.06);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1217; --surface: #151c23; --surface2: #1b242d; --ink: #e6ecf1; --muted: #93a1ae; --line: #2a3541;
    --accent: #6cbad6; --accent-ink: #0b1a22; --accent-soft: #19313c;
    --good: #46c28e; --good-soft: #14302a; --bad: #f0746c; --bad-soft: #3a1f1d; --warn: #e2ab4a; --warn-soft: #3a2e15;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1217; --surface: #151c23; --surface2: #1b242d; --ink: #e6ecf1; --muted: #93a1ae; --line: #2a3541;
  --accent: #6cbad6; --accent-ink: #0b1a22; --accent-soft: #19313c;
  --good: #46c28e; --good-soft: #14302a; --bad: #f0746c; --bad-soft: #3a1f1d; --warn: #e2ab4a; --warn-soft: #3a2e15;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); padding-inline: 16px; padding-block: 0 48px; }
h1, h2, h3 { font-family: var(--cond); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 20px; } h3 { font-size: 15px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin-inline: auto; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); margin-inline: -16px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--cond); font-size: 22px; font-weight: 600; letter-spacing: .02em; }
.brand small { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 8px; letter-spacing: 0; }
.clock { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface2); border: 1px solid var(--line); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.pill.open { color: var(--good); } .pill.open i { background: var(--good); }
.pill.pre, .pill.after { color: var(--warn); } .pill.pre i, .pill.after i { background: var(--warn); }
.pill.good { color: var(--good); background: var(--good-soft); border-color: transparent; }
.pill.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.pill.acc { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }

/* surfaces */
main { padding-block: 18px; display: grid; gap: 16px; }
.grid { display: grid; gap: 16px; align-items: start; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flat { background: var(--surface2); }
.card h3 + .muted { margin-top: 2px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.src { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.note { padding: 10px 12px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
.note.info { background: var(--accent-soft); color: var(--accent); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.good { background: var(--good-soft); color: var(--good); }

/* tiles */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--surface2); min-width: 0; }
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile .v { font-family: var(--mono); font-size: 18px; font-weight: 500; margin-top: 2px; overflow-wrap: anywhere; }
.tile .d { font-family: var(--mono); font-size: 12px; }
.up { color: var(--good); } .down { color: var(--bad); }

/* tables */
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface2); font-weight: 500; }
th button { appearance: none; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; }
th button[aria-sort] { color: var(--ink); }
td.r, th.r { text-align: right; }
tr.clk { cursor: pointer; }
tr.clk:hover td { background: var(--surface2); }
.sym { font-family: var(--mono); font-weight: 500; }
.sym + .pill { margin-left: 8px; }
.nm { color: var(--muted); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: block; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.s { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* forms */
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f.wide { grid-column: 1 / -1; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; color: var(--ink); }
input[type="checkbox"] { width: auto; }
input.num, textarea.mono { font-family: var(--mono); }
input:invalid, input.bad { border-color: var(--bad); }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.p { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.err { color: var(--bad); font-size: 12px; min-height: 16px; }

/* results */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.big { font-family: var(--mono); font-size: 28px; font-weight: 500; line-height: 1.1; }
.verdict { display: inline-block; font-family: var(--cond); font-size: 20px; padding: 3px 14px; border-radius: 6px; font-weight: 600; letter-spacing: .06em; }
.verdict.PASS { background: var(--good-soft); color: var(--good); } .verdict.BLOCK { background: var(--bad-soft); color: var(--bad); }
.checks { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; }
.checks .ok { color: var(--good); } .checks .no { color: var(--bad); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 3px; }
.bar > span { display: block; height: 100%; background: var(--accent); }
.limit.binds .bar > span { background: var(--warn); }
.limit { padding: 6px 0; border-bottom: 1px dashed var(--line); } .limit:last-child { border: 0; }
.ticket { font-family: var(--mono); font-size: 13px; background: var(--surface2); border: 1px dashed var(--line); border-radius: 6px; padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* news */
.item { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.item:last-child { border: 0; }
.item a { color: var(--ink); text-decoration: none; font-weight: 500; }
.item a:hover { text-decoration: underline; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(8,12,16,.5); z-index: 40; }
.drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow); overflow-y: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); padding-top: calc(18px + env(safe-area-inset-top, 0px)); display: grid; gap: 14px; align-content: start; }

/* chat */
.chat { display: grid; gap: 10px; }
.bub { padding: 10px 12px; border-radius: 8px; max-width: 100%; white-space: pre-wrap; overflow-wrap: anywhere; }
.bub.u { background: var(--accent-soft); justify-self: end; max-width: 92%; }
.bub.a { background: var(--surface); border: 1px solid var(--line); }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }
.hint { font-size: 11px; color: var(--muted); }
details.how { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--surface2); margin-bottom: 12px; }
details.how summary { cursor: pointer; font-weight: 600; }
details.how ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.step { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; grid-column: 1 / -1; margin-top: 4px; }
.words { font-size: 15px; line-height: 1.6; padding: 12px 14px; background: var(--accent-soft); border-radius: 6px; margin-bottom: 12px; }
.next { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.doc h3 { margin-top: 18px; } .doc p, .doc li { max-width: 72ch; } .doc ul, .doc ol { padding-left: 20px; display: grid; gap: 4px; margin: 8px 0; }
.doc dt { font-weight: 600; margin-top: 8px; } .doc dd { margin: 0; color: var(--muted); max-width: 72ch; }
.foot { font-size: 12px; color: var(--muted); margin-top: 8px; }
@media (max-width: 560px) { .hide-s { display: none; } .big { font-size: 24px; } }
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .chip { transition: border-color .12s, background-color .12s, color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">Trader Desk<small id="asof">loading…</small></div>
      <div class="clock"><span id="clock" class="muted"></span><span id="mkt" class="pill"><i></i><span>–</span></span></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  </header>
  <main id="view" aria-live="polite"></main>
  <p class="foot">Educational tool, not financial advice. Data is free and delayed (Yahoo, SEC). Nothing here places an order. Confirm every price in your broker.</p>
</div>
<div id="layer"></div>

<script>
/* Trader Desk logic. Pure functions, no DOM. Mirrors trader-exit (compute),
   trader-budget (size_trade) and trader-risk (checks). Prices are handled in
   integer cents so 358.32 never becomes 358.3199999. */
(function (root) {
  "use strict";

  var DEFAULTS = {
    budget: 5000, cash_buffer_pct: 10, max_position_pct: 75, max_order_usd: 4000,
    min_order_usd: 5, max_loss_per_trade_usd: 50, max_daily_loss_usd: 150,
    max_trades_per_day: 3, min_reward_risk: 1.0,
    no_entries_before: "09:45", no_entries_after: "15:30", flat_by: "15:55"
  };

  var MIN_RISK_PCT = 0.05;

  function num(x) {
    if (x === null || x === undefined || x === "") return NaN;
    var n = typeof x === "number" ? x : parseFloat(String(x).replace(/[$,\s]/g, ""));
    return isFinite(n) ? n : NaN;
  }
  function toCents(x) { return Math.round(num(x) * 100 + 1e-9); }
  function floorCents(x) { return Math.floor(num(x) * 100 + 1e-9); }
  function fromCents(c) { return c / 100; }
  function money(x, d) {
    if (!isFinite(x)) return "–";
    var neg = x < 0, v = Math.abs(x);
    var s = v.toLocaleString("en-US", { minimumFractionDigits: d === undefined ? 2 : d, maximumFractionDigits: d === undefined ? 2 : d });
    return (neg ? "-$" : "$") + s;
  }
  function hhmmToMin(t) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(t || "").trim());
    if (!m) return NaN;
    var h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return NaN;
    return h * 60 + mi;
  }

  /* ---------- exit plan: stop + target in exact cents ---------- */
  function computePlan(o) {
    var e = toCents(o.entry);
    if (!(e > 0)) return { error: "Enter an entry price above $0." };
    var raw, label;
    var rule = o.stopRule || "or_mid";
    if (rule === "or_mid" || rule === "or_low") {
      var oh = toCents(o.orHigh), ol = toCents(o.orLow);
      if (!(oh > 0) || !(ol > 0)) return { error: "An opening-range stop needs the range high and low." };
      if (oh <= ol) return { error: "The range high must be above the range low." };
      raw = rule === "or_mid" ? (oh + ol) / 2 : ol;
      label = rule === "or_mid" ? "opening-range midpoint" : "opening-range low";
    } else if (rule === "price") {
      var sp = num(o.stopParam);
      if (!isFinite(sp)) return { error: "Enter your stop price." };
      raw = sp * 100; label = "your price";
    } else if (rule === "pct") {
      var p = num(o.stopParam);
      if (!isFinite(p) || p <= 0 || p >= 100) return { error: "Enter a stop percent between 0 and 100." };
      raw = e * (1 - p / 100); label = p + "% under the entry";
    } else if (rule === "atr") {
      var a = num(o.atr), k = num(o.stopParam);
      if (!isFinite(a) || a <= 0) return { error: "An ATR stop needs the ATR value." };
      if (!isFinite(k) || k <= 0) return { error: "Enter an ATR multiple above 0." };
      raw = e - k * a * 100; label = k + " x ATR under the entry";
    } else return { error: "Unknown stop rule." };
    var stop = Math.floor(raw + 1e-6);
    if (stop >= e) return { error: "The stop " + money(fromCents(stop)) + " is at or above the entry " + money(fromCents(e)) + ". A long's stop goes under the entry." };
    if (stop <= 0) return { error: "The stop works out to " + money(fromCents(stop)) + ". Pick a stop above $0." };
    var risk = e - stop;
    if (risk < e * MIN_RISK_PCT / 100) return { error: "The stop is " + money(fromCents(risk)) + " under the entry, tighter than 0.05% of the price. Normal wiggle would stop you out. Widen it." };
    var target, tLabel;
    if (o.targetRule === "price") {
      var tp = num(o.targetParam);
      if (!isFinite(tp)) return { error: "Enter your target price." };
      target = toCents(tp); tLabel = "your price";
    } else {
      var r = num(o.targetParam === undefined || o.targetParam === "" ? 2 : o.targetParam);
      if (!isFinite(r) || r <= 0) return { error: "Enter a target in R above 0." };
      target = Math.round(e + r * risk); tLabel = r + "R";
    }
    if (target <= e) return { error: "The target " + money(fromCents(target)) + " is at or below the entry " + money(fromCents(e)) + "." };
    var rr = Math.round((target - e) / risk * 100) / 100;
    return {
      entry: fromCents(e), stop: fromCents(stop), target: fromCents(target),
      risk: fromCents(risk), reward: fromCents(target - e), rr: rr,
      stopLabel: label, targetLabel: tLabel
    };
  }

  /* ---------- sizing: four limits, smallest wins ---------- */
  function sharesFor(usd, perShare) {
    var u = Math.round(num(usd) * 100), p = Math.round(num(perShare) * 100);
    if (!(p > 0) || !(u > 0)) return 0;
    return Math.floor(u / p);
  }
  function sizeTrade(plan, cfg, opts) {
    var c = Object.assign({}, DEFAULTS, cfg || {});
    opts = opts || {};
    var ref = num(plan.entry), stop = num(plan.stop), target = num(plan.target);
    if (!(ref > 0) || !(stop > 0) || !(target > 0)) return { error: "The plan needs an entry, a stop and a target." };
    if (stop >= ref) return { error: "The stop is not below the entry." };
    if (target <= ref) return { error: "The target is not above the entry." };
    var budget = num(c.budget);
    if (!(budget > 0)) return { error: "Set an account budget above $0 in Settings." };
    var buf = num(c.cash_buffer_pct) || 0;
    if (buf < 0 || buf >= 100) return { error: "Cash buffer must be between 0 and 100 percent." };
    var riskC = toCents(ref) - toCents(stop), rewardC = toCents(target) - toCents(ref);
    var risk = riskC / 100;
    var available = Math.max(budget - Math.round(budget * buf) / 100, 0);
    var limits = [];
    var ml = num(c.max_loss_per_trade_usd);
    if (ml > 0) limits.push({ name: "Max loss", usd: ml, shares: sharesFor(ml, risk), how: money(ml) + " ÷ " + money(risk) + " risk a share" });
    var cp = num(c.max_position_pct);
    if (cp > 0) { var cap = Math.round(budget * cp) / 100; limits.push({ name: "Position cap", usd: cap, shares: sharesFor(cap, ref), how: cp + "% of " + money(budget, 0) + " = " + money(cap, 0) + " ÷ " + money(ref) }); }
    var mo = num(c.max_order_usd);
    if (mo > 0) limits.push({ name: "Max order", usd: mo, shares: sharesFor(mo, ref), how: money(mo, 0) + " ÷ " + money(ref) });
    limits.push({ name: "Cash", usd: available, shares: sharesFor(available, ref), how: money(available) + " after the " + buf + "% buffer ÷ " + money(ref) });
    var qty = Math.max(0, Math.min.apply(null, limits.map(function (l) { return l.shares; })));
    var bound = limits.filter(function (l) { return l.shares === qty; })[0].name;
    limits.forEach(function (l) { l.binds = l.name === bound; });
    var cost = Math.round(qty * ref * 100) / 100;
    var maxLoss = Math.round(qty * riskC) / 100;
    var reward = Math.round(qty * rewardC) / 100;
    var refusal = null;
    var minRR = num(c.min_reward_risk);
    if (qty === 0) {
      refusal = bound === "Max loss"
        ? "One share risks " + money(risk) + ", more than your " + money(ml) + " max loss per trade. Skip it or plan a closer stop."
        : "One share costs " + money(ref) + ", more than your " + bound.toLowerCase() + " limit.";
    } else if (minRR > 0 && rewardC < minRR * riskC - 1e-9) {
      refusal = "Reward:risk " + (rewardC / riskC).toFixed(2) + " is under your minimum " + minRR + ".";
    } else if (cost < num(c.min_order_usd)) {
      refusal = qty + " share(s) cost " + money(cost) + ", under your " + money(num(c.min_order_usd)) + " minimum order.";
    }
    return {
      qty: qty, cost: cost, maxLoss: maxLoss, maxReward: reward, risk: risk, limits: limits,
      boundBy: bound, refusal: refusal, rr: Math.round(rewardC / riskC * 100) / 100,
      pctOfBudget: Math.round(cost / budget * 1000) / 10
    };
  }

  /* ---------- risk check: PASS / BLOCK with reasons ---------- */
  function riskCheck(plan, sizing, cfg, state) {
    var c = Object.assign({}, DEFAULTS, cfg || {});
    state = state || {};
    var checks = [];
    function add(name, ok, detail) { checks.push({ name: name, ok: !!ok, detail: detail }); }
    if (!sizing || sizing.error) {
      add("Plan valid", false, sizing && sizing.error ? sizing.error : "No sizing available.");
      return { verdict: "BLOCK", checks: checks };
    }

    var idx = S.chat.length - 1;
    try {
      var res = await sample(turns, { cache: false, signal: ctl.signal, modelTier: "default", onText: function (u) { S.chat[idx].content = u.text; updateChat(); scrollChat(); } });
      S.chat[idx].content = res.text; if (res.truncated) S.chatNote = "The answer was cut short. Ask for less at a time.";
    } catch (e) {
      var partial = e && e.text ? e.text : "";
      if (partial) S.chat[idx].content = partial; else S.chat.splice(idx, 1);
      if (!e || e.code !== "cancelled") S.chatNote = copyFor(e && e.code);
      if (e && /^(not_granted|sampling_disabled|not_declared|capability_disabled|capability_removed)$/.test(e.code)) S.sampleOK = false;
    } finally { S.chatBusy = false; S.chatCtl = null; if (S.tab === "ask") updateChat(); }
  }
  function scrollChat() { var c = $("#chat"); if (c && c.lastChild && c.lastChild.scrollIntoView) c.lastChild.scrollIntoView({ block: "nearest" }); }

  /* ---------------- events ---------------- */
  function go(tab) { S.tab = tab; S.drawer = null; try { history.replaceState(null, "", "#" + tab); } catch (e) { /* ignore */ } lsSet("td.tab", tab); render(); window.scrollTo(0, 0); }
  function showJErr(m) { var e = $("#j-err"); if (e) e.textContent = m; }
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]"); if (!t) return;
    var a = t.getAttribute("data-act"), v = t.getAttribute("data-v");
    if (a === "tab") go(v);
    else if (a === "reload") boot();
    else if (a === "dte") { S.csp.expiry = addDays(today(), +v); S.csp.example = false; render(); }
    else if (a === "open") { S.drawer = v; S.ctxSym = v; renderDrawer(); }
    else if (a === "close") { S.drawer = null; renderDrawer(); }
    else if (a === "goscan") { S.f.setup = v; S.f.shown = 50; go("scanner"); }
    else if (a === "setup") { S.f.setup = v; S.f.shown = 50; Array.prototype.forEach.call(document.querySelectorAll("#f-chips .chip"), function (c) { c.setAttribute("aria-pressed", String(c.getAttribute("data-v") === v)); }); updateScanBody(); }
    else if (a === "sort") { if (S.f.sort === v) S.f.dir = S.f.dir === "asc" ? "desc" : "asc"; else { S.f.sort = v; S.f.dir = v === "symbol" ? "asc" : "desc"; } render(); }
    else if (a === "more") { S.f.shown += 50; updateScanBody(); }
    else if (a === "morenews") { S.news_f.shown += 40; updateNews(); }
    else if (a === "plan") startPlan(v);
    else if (a === "askabout") { go2ask("Explain the " + v + " setup on my shortlist: what the scan shows, what to watch at the open, and what would invalidate it.", v); }
    else if (a === "askplan") go2ask("Review the trade plan currently in the Planner. What are the weak points, and does the stop make sense?");
    else if (a === "askcsp") go2ask("Critique the cash-secured put in the Options calculator: strike distance, size versus my account, earnings, and what could go wrong.");
    else if (a === "quick") ask(v);
    else if (a === "send") { var q = N("a-in"); var ta = $("#a-in"); if (ta) ta.value = ""; ask(q); }
    else if (a === "stop") { if (S.chatCtl) S.chatCtl.abort(); }
    else if (a === "clearchat") { if (S.chatCtl) S.chatCtl.abort(); S.chat = []; S.chatNote = ""; updateChat(); }
    else if (a === "copy") copyText(v, t);
    else if (a === "logplan") {
      var c = planCalc(); if (c.error || c.size.qty < 1) return;
      jAdd({ sym: (S.plan.symbol || "?").toUpperCase(), entry: c.plan.entry, stop: c.plan.stop, target: c.plan.target, qty: c.size.qty, exit: null, day: today(), note: "from planner" }).then(function () { t.textContent = "Logged"; t.disabled = true; });
    }
    else if (a === "jadd") {
      var sym = N("j-sym").trim().toUpperCase(), en = L.num(N("j-entry")), st = L.num(N("j-stop")), tg = L.num(N("j-target")), q2 = L.num(N("j-qty")), ex = N("j-exit").trim();
      if (!/^[A-Z.\-]{1,8}$/.test(sym)) return showJErr("Enter a symbol (letters only).");
      if (!(en > 0) || !(st > 0) || !(q2 >= 1) || Math.floor(q2) !== q2) return showJErr("Entry, stop and a whole number of shares are required.");
      if (st >= en) return showJErr("A long's stop goes under the entry.");
      if (ex !== "" && !(L.num(ex) > 0)) return showJErr("Exit must be a price above 0, or leave it empty.");
      jAdd({ sym: sym, entry: en, stop: st, target: isFinite(tg) ? tg : null, qty: q2, exit: ex === "" ? null : L.num(ex), day: today(), note: N("j-note").trim() }).then(function () { if (S.tab === "journal") render(); });
    }
    else if (a === "jclose") { var xv = L.num(N("x-" + v)); if (!(xv > 0)) return; jUpdate(v, { exit: xv }).then(function () { if (S.tab === "journal") render(); }); }
    else if (a === "jdel") { jDelete(v).then(function () { if (S.tab === "journal") render(); }); }
    else if (a === "sreset") { S.cfg = Object.assign({}, L.DEFAULTS); S.settingsErr = ""; saveCfg(); render(); }
  });
  function go2ask(q, sym) { S.tab = "ask"; S.drawer = null; if (sym) S.ctxSym = sym; lsSet("td.tab", "ask"); render(); window.scrollTo(0, 0); ask(q); }
  function copyText(id, btn) {
    var el = document.getElementById(id); if (!el) return;
    var done = function () { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy ticket"; }, 1500); };
    try { navigator.clipboard.writeText(el.textContent).then(done, function () { sel(el); btn.textContent = "Select and copy"; }); } catch (e) { sel(el); btn.textContent = "Select and copy"; }
  }
  function sel(el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && S.drawer) { S.drawer = null; renderDrawer(); }
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("tr.clk")) { ev.preventDefault(); S.drawer = ev.target.getAttribute("data-v"); renderDrawer(); }
    if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey) && ev.target.id === "a-in") { var q = ev.target.value; ev.target.value = ""; ask(q); }
  });
  document.addEventListener("toggle", function (ev) { if (ev.target && ev.target.id === "p-help") lsSet("td.planhelp", ev.target.open ? "1" : "0"); }, true);
  document.addEventListener("input", function (ev) {
    var id = ev.target.id || "";
    if (id === "p-pick") { if (ev.target.value) startPlan(ev.target.value); return; }
    if (id.indexOf("p-") === 0) { readPlan(); S.plan.example = false; if (id === "p-stopRule" || id === "p-targetRule") render(); else updatePlanner(); }
    else if (id.indexOf("c-") === 0) { readCsp(); S.csp.example = false; updateCsp(); }
    else if (id === "f-q") { S.f.query = ev.target.value; S.f.shown = 50; updateScanBody(); }
    else if (id === "f-max") { S.f.maxPrice = ev.target.value; S.f.shown = 50; updateScanBody(); }
    else if (id === "f-fit") { S.f.fit = ev.target.checked; S.f.shown = 50; updateScanBody(); }
    else if (id === "n-t") { S.news_f.ticker = ev.target.value; S.news_f.shown = 40; updateNews(); }
    else if (id === "n-g") { S.news_f.tag = ev.target.value; S.news_f.shown = 40; updateNews(); }
    else if (id.indexOf("s-") === 0 && id !== "s-err") {
      var key = id.slice(2), f = CFG_FIELDS.filter(function (x) { return x[0] === key; })[0]; if (!f) return;
      var v = ev.target.value, ok = f[2] === "time" ? isFinite(L.hhmmToMin(v)) : (isFinite(L.num(v)) && L.num(v) >= 0 && v.trim() !== "");
      ev.target.classList.toggle("bad", !ok);
      var err = $("#s-err"); if (!ok) { if (err) err.textContent = f[1] + ": enter a valid " + (f[2] === "time" ? "time" : "number, 0 or more") + "."; return; }
      if (err) err.textContent = "";
      S.cfg[key] = f[2] === "time" ? v : L.num(v); saveCfg();
    }
  });

  /* ---------------- boot ---------------- */
  function fetchJSON(p) { return fetch(p, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error(p + " " + r.status); return r.json(); }); }
  async function boot() {
    S.loadErr = null;
    var res = await Promise.allSettled([fetchJSON("data/scan.json"), fetchJSON("data/news.json"), fetchJSON("data/earnings.json"), fetchJSON("data/market.json")]);
    var bad = res.filter(function (r) { return r.status === "rejected"; });
    if (bad.length) S.loadErr = "Could not load the data files (" + bad.map(function (b) { return b.reason && b.reason.message; }).join(", ") + "). Check your connection and try again.";
    else { S.scan = res[0].value; S.news = res[1].value; S.earn = res[2].value; S.market = res[3].value; }
    if (S.scan) $("#asof").textContent = "scan " + S.scan.as_of;
    else $("#asof").textContent = "no data";
    var hash = (location.hash || "").replace("#", ""), saved = lsGet("td.tab");
    var want = TABS.some(function (t) { return t[0] === hash; }) ? hash : TABS.some(function (t) { return t[0] === saved; }) ? saved : "today";
    S.tab = want;
    render();
    connect();
  }
  async function connect() {
    var cl = window.claude; if (!cl || typeof cl.use !== "function") { S.sampleOK = false; return; }
    var user = null, uid = null;
    try { db = await cl.use("db"); } catch (e) { db = null; }
    try { user = await cl.use("user"); uid = user ? await user.id() : null; } catch (e) { uid = null; }
    try { sample = await cl.use("sample"); } catch (e) { sample = null; }
    S.sampleOK = !!sample;
    if (S.tab === "ask") updateChat();
    if (!db) return;
    if (!uid) { db = null; S.dbNote = "Could not identify your account, so settings and journal stay in this browser."; renderIfTab(["settings", "journal"]); return; }
    var canW = null; try { canW = user && typeof user.can === "function" ? user.can("data.write") : null; } catch (e) { canW = null; }
    if (canW === false) { db = null; S.dbNote = "You have view-only access, so your settings and journal are saved in this browser only. Ask the owner for Contributor access to sync them."; renderIfTab(["settings", "journal"]); return; }
    S.store = "db"; S.dbNote = "";
    try {
      base = "data/users/" + uid + "/profile";
      var prof = db.doc(base); jcoll = prof.collection("journal");
      unsubs.push(prof.onSnapshot(function (snap) {
        var d = snap.exists ? snap.data() : null;
        if (d && d.cfg && !cfgTimer) { S.cfg = cfgClean(d.cfg); lsSet("td.cfg", JSON.stringify(S.cfg)); renderIfTab(["settings", "planner", "today", "scanner"]); }
        else renderIfTab(["settings"]);
      }, function (e) { S.dbNote = "Settings sync stopped (" + (e && e.code) + ")."; }));
      unsubs.push(jcoll.orderBy("created", "desc").limit(300).onSnapshot(function (snap) {
        S.journal = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        renderIfTab(["journal", "planner"]);
      }, function (e) { S.dbNote = "Journal sync stopped (" + (e && e.code) + ")."; renderIfTab(["journal"]); }));
    } catch (e) { S.dbNote = "Private storage unavailable. Using this browser."; db = null; }
    if (S.tab === "settings" || S.tab === "journal") renderIfTab([S.tab]);
  }

  loadLocal();
  renderTabs(); renderClock();
  setInterval(renderClock, 20000);
  boot();
})();
</script>
